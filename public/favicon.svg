  <circle cx="32" cy="32" r="15" fill="none" stroke="#ffc857" stroke-width="9" stroke-dasharray="16.65 94.25" stroke-dashoffset="-61.26" transform="rotate(-90 32 32)"/> <!-- amber, 20% -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#ff8a7a" stroke-width="9" stroke-dasharray="11.94 94.25" stroke-dashoffset="-80.11" transform="rotate(-90 32 32)"/> <!-- coral, 15% -->
