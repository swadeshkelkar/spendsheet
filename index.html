<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spendsheet</title>
    <script>
      // Pick the theme before the page draws, so dark mode never flashes light.
      // This repeats the logic in src/lib/theme.js on purpose: it has to run
      // before the app's JavaScript has even loaded.
      try {
        const choice = localStorage.getItem("spendsheet:theme") || "system";
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const dark =
          choice === "dark" || (choice === "system" && prefersDark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light"; // storage blocked
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
